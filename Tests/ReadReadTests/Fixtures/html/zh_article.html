<h1>语音合成简史</h1>
<p>语音合成是通过机械的、电子的方法产生人造语音的技术。它把文字转换成可以听懂的声音，让计算机能够开口说话。</p>
<h2>早期的尝试</h2>
<p>早在电子信号处理出现之前，就有人尝试用机械装置模仿人的声音。这些装置用风箱、簧片和皮管来塑造声音。</p>
<p>到了二十世纪，研究者开始用电路合成语音，后来又用计算机程序生成波形。</p>
